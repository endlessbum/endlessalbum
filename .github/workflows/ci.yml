name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Используем npm run lint (без --max-warnings=0):
      # в проекте есть накопленные warnings, они не блокируют CI,
      # но ошибки ESLint упадут однозначно.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Smoke (in-memory storage)
        run: npm run -s smoke

      - name: Build
        run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: endlessalbum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max